name: Bug report
description: Something is wrong, missing, or looks broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please do not paste shell history, agent logs, commit messages, file names, or paths.** They can hold passwords and private text, and an issue is public.

        The terminal summary that devwrapped prints is safe to paste. If a file fails to parse, describe its structure and replace every value with `x`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you run, and what went wrong?
      placeholder: "I ran devwrapped --format png and the shell slide was missing."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `devwrapped --version`
      placeholder: devwrapped 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      description: Which source is the bug about, if any?
      multiple: true
      options:
        - git
        - bash
        - zsh
        - fish
        - PowerShell
        - Claude Code
        - Codex CLI
        - none of these
  - type: textarea
    id: output
    attributes:
      label: Terminal summary
      description: The summary devwrapped printed, if it helps. Check it before you post, and remove anything you would not share.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue holds no shell history, agent logs, commit messages, file names, or paths.
          required: true
