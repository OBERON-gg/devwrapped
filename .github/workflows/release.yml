name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # musl links statically, so the binary does not depend on the runner's glibc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # a static runtime removes the need for the Visual C++ redistributable
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p devwrapped --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: pack
        shell: bash
        run: |
          name="devwrapped-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp README.md PRIVACY.md LICENSE-MIT LICENSE-APACHE crates/devwrapped-card/fonts/OFL-*.txt "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/devwrapped.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/devwrapped" "$name/"
            tar -czf "$name.tar.gz" "$name"
            echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      # a draft stays hidden until a maintainer checks and publishes it
      - name: create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --title "$GITHUB_REF_NAME"
          --generate-notes
